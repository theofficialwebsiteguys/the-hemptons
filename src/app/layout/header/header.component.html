<header class="header" [class.header--transparent]="transparent()">
  <div class="header__inner container">
    <button
      type="button"
      class="header__menu-toggle"
      (click)="uiState.openMobileMenu()"
      aria-label="Open menu"
    >
      <app-icon name="menu" />
    </button>

    <a routerLink="/" class="header__logo">{{ site.shortName }}</a>

    <nav class="header__nav" aria-label="Primary">
      @for (link of categoryLinks; track link.route) {
        <a [routerLink]="link.route" routerLinkActive="header__link--active">{{ link.label }}</a>
      }
      @for (link of site.navigation; track link.route) {
        <a [routerLink]="link.route" routerLinkActive="header__link--active">{{ link.label }}</a>
      }
    </nav>

    <div class="header__actions">
      <a routerLink="/search" class="header__action" aria-label="Search">
        <app-icon name="search" />
      </a>
      <button
        type="button"
        class="header__action header__cart"
        (click)="cartState.toggleDrawer()"
        aria-label="Open cart"
      >
        <app-icon name="cart" />
        @if (cartState.cartQuantity() > 0) {
          <span class="header__cart-count">{{ cartState.cartQuantity() }}</span>
        }
      </button>
    </div>
  </div>
</header>
