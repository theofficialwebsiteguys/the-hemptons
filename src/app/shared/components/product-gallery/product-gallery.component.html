<div class="gallery">
  <div class="gallery__main">
    <app-image [image]="activeImage()" [altFallback]="title()" [priority]="true" />

    <button type="button" class="gallery__zoom-trigger" (click)="openLightbox()" [attr.aria-label]="'View ' + title() + ' full size'">
      <span class="gallery__zoom-hint" aria-hidden="true">
        <app-icon name="search" [size]="16" />
      </span>
    </button>

    @if (images().length > 1) {
      <button type="button" class="gallery__nav gallery__nav--prev" (click)="previous()" aria-label="Previous image">
        <app-icon name="chevron-left" />
      </button>
      <button type="button" class="gallery__nav gallery__nav--next" (click)="next()" aria-label="Next image">
        <app-icon name="chevron-right" />
      </button>
    }
  </div>

  @if (images().length > 1) {
    <div class="gallery__thumbs">
      @for (image of images(); track image.url; let i = $index) {
        <button
          type="button"
          class="gallery__thumb"
          [class.gallery__thumb--active]="i === activeIndex()"
          (click)="select(i)"
          [attr.aria-label]="'View image ' + (i + 1)"
          [attr.aria-current]="i === activeIndex()"
        >
          <app-image [image]="image" [altFallback]="title()" />
        </button>
      }
    </div>
  }
</div>

<app-image-lightbox
  [images]="images()"
  [activeIndex]="activeIndex()"
  [title]="title()"
  [open]="lightboxOpen()"
  (close)="closeLightbox()"
  (indexChange)="select($event)"
/>
