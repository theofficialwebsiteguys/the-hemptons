<section class="newsletter section">
  <div class="newsletter__inner container">
    <h2>Stay in the loop</h2>
    <p class="text-muted">Sign up for restocks, new arrivals, and occasional discounts.</p>

    @if (submitted()) {
      <p class="newsletter__success">You're on the list — thanks for signing up.</p>
    } @else {
      <form class="newsletter__form" [formGroup]="form" (ngSubmit)="submit()">
        <input
          class="field__control"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          aria-label="Email address"
        />
        <app-button type="submit">Sign up</app-button>
      </form>
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <p class="field__error">Enter a valid email address.</p>
      }
    }
  </div>
</section>
